<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF to text – PDF Tools</title><meta name="description" content="Pull the text out of a PDF. Scanned PDFs without a text layer will come out empty.">
<link rel="stylesheet" href="style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script></head><body>
<header><a href="index.html">PDF Tools</a></header>
<main><h1>PDF to text</h1><p class="lede">Pull the text out of a PDF. Scanned PDFs without a text layer will come out empty.</p>
<div id="drop" tabindex="0">Drop a PDF here or <label for="inp">choose from your device</label><input id="inp" type="file" hidden></div>
<ul id="list"></ul><div id="opts"></div>
<button id="go">Extract text</button><p id="status" role="status"></p></main>
<footer>Everything runs in your browser. Your files are never uploaded.</footer>
<script src="common.js"></script>
<script>init({accept:"application/pdf",multiple:false,run:async(files)=>{
await pdfjsReady();
const pdf=await pdfjsLib.getDocument({data:await files[0].arrayBuffer()}).promise;let t='';
for(let i=1;i<=pdf.numPages;i++){const c=await (await pdf.getPage(i)).getTextContent();
t+=`--- Page ${i} ---\n`+c.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('')+'\n\n';}
return [['text.txt',t,'text/plain']];
}})</script></body></html>
