<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delete pages – PDF Tools</title><meta name="description" content="Remove the pages you list and keep the rest.">
<link rel="stylesheet" href="style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script></head><body>
<header><a href="index.html">PDF Tools</a></header>
<main><h1>Delete pages</h1><p class="lede">Remove the pages you list and keep the rest.</p>
<div id="drop" tabindex="0">Drop a PDF here or <label for="inp">choose from your device</label><input id="inp" type="file" hidden></div>
<ul id="list"></ul><div id="opts"><label>Pages to delete <input id="range" placeholder="1-3, 5, 8"></label></div>
<button id="go">Delete pages</button><p id="status" role="status"></p></main>
<footer>Everything runs in your browser. Your files are never uploaded.</footer>
<script src="common.js"></script>
<script>init({accept:"application/pdf",multiple:false,run:async(files)=>{
const s=await PDFLib.PDFDocument.load(await files[0].arrayBuffer());
const del=[...new Set(ranges($('#range').value,s.getPageCount()))].sort((a,b)=>b-a);
if(del.length>=s.getPageCount())throw Error('That would delete every page.');
del.forEach(i=>s.removePage(i));
return [['edited.pdf',await s.save(),'application/pdf']];
}})</script></body></html>
