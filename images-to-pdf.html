<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Images to PDF – PDF Tools</title><meta name="description" content="Turn JPG, PNG or WebP images into one PDF, one image per page.">
<link rel="stylesheet" href="style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script></head><body>
<header><a href="index.html">PDF Tools</a></header>
<main><h1>Images to PDF</h1><p class="lede">Turn JPG, PNG or WebP images into one PDF, one image per page.</p>
<div id="drop" tabindex="0">Drop images here or <label for="inp">choose from your device</label><input id="inp" type="file" hidden></div>
<ul id="list"></ul><div id="opts"></div>
<button id="go">Create PDF</button><p id="status" role="status"></p></main>
<footer>Everything runs in your browser. Your files are never uploaded.</footer>
<script src="common.js"></script>
<script>init({accept:"image/*",multiple:true,run:async(files)=>{
const d=await PDFLib.PDFDocument.create();
for(const f of files){let img;
if(f.type==='image/jpeg')img=await d.embedJpg(await f.arrayBuffer());
else if(f.type==='image/png')img=await d.embedPng(await f.arrayBuffer());
else{const bm=await createImageBitmap(f),c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;c.getContext('2d').drawImage(bm,0,0);
img=await d.embedPng(await (await new Promise(r=>c.toBlob(r))).arrayBuffer());}
d.addPage([img.width,img.height]).drawImage(img,{x:0,y:0,width:img.width,height:img.height});}
return [['images.pdf',await d.save(),'application/pdf']];
}})</script></body></html>
