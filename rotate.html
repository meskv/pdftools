<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotate pages – PDF Tools</title><meta name="description" content="Rotate every page, or only the pages you list.">
<link rel="stylesheet" href="style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script></head><body>
<header><a href="index.html">PDF Tools</a></header>
<main><h1>Rotate pages</h1><p class="lede">Rotate every page, or only the pages you list.</p>
<div id="drop" tabindex="0">Drop a PDF here or <label for="inp">choose from your device</label><input id="inp" type="file" hidden></div>
<ul id="list"></ul><div id="opts"><label>Pages (leave empty for all) <input id="range" placeholder="1-3, 5, 8"></label><label>Rotate by <select id="angle"><option value="90">90° clockwise</option><option value="180">180°</option><option value="270">90° counter-clockwise</option></select></label></div>
<button id="go">Rotate</button><p id="status" role="status"></p></main>
<footer>Everything runs in your browser. Your files are never uploaded.</footer>
<script src="common.js"></script>
<script>init({accept:"application/pdf",multiple:false,run:async(files)=>{
const s=await PDFLib.PDFDocument.load(await files[0].arrayBuffer());
const v=$('#range').value.trim(),a=+$('#angle').value;
(v?ranges(v,s.getPageCount()):s.getPageIndices()).forEach(i=>{const p=s.getPage(i);p.setRotation(PDFLib.degrees((p.getRotation().angle+a)%360));});
return [['rotated.pdf',await s.save(),'application/pdf']];
}})</script></body></html>
